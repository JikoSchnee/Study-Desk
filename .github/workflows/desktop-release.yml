name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node -e "const version = require('./package.json').version; if ('v' + version !== process.env.GITHUB_REF_NAME) throw new Error('Tag must equal package.json version.');"
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm test

  build-macos:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build macOS application
        run: npm run desktop:dist -- --mac --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/*

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows application
        run: npm run desktop:dist -- --win --x64
      - name: Verify Windows update artifacts
        shell: pwsh
        run: |
          Get-ChildItem release
          if (-not (Test-Path "release/latest.yml")) { throw "Missing latest.yml update manifest." }
          if (-not (Get-ChildItem "release/Study-Desk-Setup-*.exe")) { throw "Missing NSIS installer." }
          if (-not (Get-ChildItem "release/Study-Desk-Setup-*.exe.blockmap")) { throw "Missing NSIS blockmap." }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate release report from commits
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          commit_range="${GITHUB_SHA}"
          if [ -n "$previous_tag" ]; then commit_range="${previous_tag}..${GITHUB_SHA}"; fi
          {
            echo "## 本次更新"
            echo
            git log "$commit_range" --format='- `%h` %s%n%n%b'
          } > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: false
          files: release/*
